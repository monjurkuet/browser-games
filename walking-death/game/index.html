	<script>
if (location.protocol.substr(0, 4) === "file")
{
	alert("Web exports won't work until you upload them. (When running on the file: protocol, browsers block many features from working for security reasons.)");
}

// Move the Construct-created canvas into our responsive wrapper once it exists,
// then clear the runtime's inline sizing so CSS controls layout.
(function ()
{
	const retries = [500, 1000, 2000, 3000];
	function moveCanvas()
	{
		const canvas = document.querySelector("body > canvas");
		const wrapper = document.getElementById("c3-canvas-wrapper");
		if (canvas && wrapper && canvas.parentElement !== wrapper)
		{
			wrapper.appendChild(canvas);
			canvas.style.width = "";
			canvas.style.height = "";
			canvas.style.margin = "";
			canvas.style.position = "";
			return true;
		}
		return false;
	}
	function schedule()
	{
		const delay = retries.shift();
		if (delay === undefined) return; // give up silently; game still runs
		setTimeout(() => { if (!moveCanvas()) schedule(); }, delay);
	}
	if (document.readyState === "loading")
		document.addEventListener("DOMContentLoaded", schedule);
	else
		schedule();
})();
	</script>
