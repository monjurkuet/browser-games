<script>
// Move canvas into wrapper after C3 runtime initializes
    (function() {
        const wrapper = document.getElementById('c3-canvas-wrapper');
        const container = document.getElementById('c3-game-container');
        
        function moveCanvas() {
            const canvas = document.querySelector('canvas');
            if (canvas && canvas.parentElement !== wrapper) {
                // Clear all inline styles set by C3 runtime
                canvas.style.width = '';
                canvas.style.height = '';
                canvas.style.margin = '';
                canvas.style.position = '';
                canvas.style.display = '';
                canvas.style.marginLeft = '';
                canvas.style.marginTop = '';
                
                wrapper.appendChild(canvas);
                console.log('[Toyland Fortune] Canvas moved to responsive wrapper');
                
                // Force canvas CSS size to match wrapper
                canvas.style.width = '100%';
                canvas.style.height = '100%';
                canvas.style.display = 'block';
                canvas.style.backgroundColor = '#000000';
                // Also force renderer to use opaque clear
                if (window.c3_runtimeInterface && window.c3_runtimeInterface._localRuntime) {
                    const renderer = window.c3_runtimeInterface._localRuntime.GetRenderer();
                    if (renderer && renderer.SetClearColor) {
                        renderer.SetClearColor(0, 0, 0, 1);
                    }
                }
                
                // Notify C3 runtime of canvas CSS size change
                if (window.c3_runtimeInterface && typeof window.c3_runtimeInterface.UpdateCanvasCSSSize === 'function') {
                    try {
                        window.c3_runtimeInterface.UpdateCanvasCSSSize();
                        console.log('[Toyland Fortune] Called UpdateCanvasCSSSize');
                    } catch (e) {
                        console.warn('[Toyland Fortune] UpdateCanvasCSSSize failed:', e);
                    }
                }
                return true;
            }
            return false;
        }
        
        // Also handle resize
        function handleResize() {
            if (window.c3_runtimeInterface && typeof window.c3_runtimeInterface.UpdateCanvasCSSSize === 'function') {
                try {
                    window.c3_runtimeInterface.UpdateCanvasCSSSize();
                } catch (e) {
                    console.warn('[Toyland Fortune] UpdateCanvasCSSSize on resize failed:', e);
                }
            }
        }
        
        // Try immediately
        if (!moveCanvas()) {
            // Retry with increasing delays
            const delays = [500, 1000, 2000, 3000];
            delays.forEach(delay => {
                setTimeout(moveCanvas, delay);
            });
            // Also try on window load
            window.addEventListener('load', moveCanvas);
        }
        
        // Watch for canvas size changes
        const canvas = document.querySelector('canvas');
        if (canvas && window.ResizeObserver) {
            new ResizeObserver(handleResize).observe(canvas);
        }
        window.addEventListener('resize', handleResize);
        
        // Send wrapper size to runtime as "window-resize" to force correct canvas sizing
        function syncWrapperSizeToRuntime() {
            const wrapper = document.getElementById('c3-canvas-wrapper');
            if (wrapper && window.c3_runtimeInterface) {
                const rect = wrapper.getBoundingClientRect();
                window.c3_runtimeInterface.PostToRuntimeComponent('runtime', 'window-resize', {
                    innerWidth: rect.width,
                    innerHeight: rect.height,
                    devicePixelRatio: window.devicePixelRatio,
                    isFullscreen: document.fullscreenElement !== null,
                    cssDisplayMode: window.c3_runtimeInterface.GetCssDisplayMode()
                });
            }
        }
        
        // Sync after canvas moved and on resize
        const originalMoveCanvas = moveCanvas;
        moveCanvas = function() {
            const result = originalMoveCanvas();
            if (result) {
                setTimeout(syncWrapperSizeToRuntime, 100);
            }
            return result;
        };
        
        window.addEventListener('resize', () => {
            handleResize();
            setTimeout(syncWrapperSizeToRuntime, 100);
        });
        
        // Also sync after a delay to catch initial layout
        setTimeout(syncWrapperSizeToRuntime, 2000);
    })();
</script>
