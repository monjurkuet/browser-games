<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Magic Ace</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#071b24;color:#fff;font-family:Arial,sans-serif;overflow:hidden}.shell{width:min(100vw,520px);height:100dvh;margin:auto;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#174a56,#07141d 70%)}.game{position:relative;width:100%;height:100%;padding:12px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(150deg,rgba(20,85,89,.94),rgba(7,25,37,.98));box-shadow:inset 0 0 50px #d5a53d55}.top{display:flex;justify-content:space-between;align-items:center;font-weight:bold;color:#f5d477}.title{font-size:22px;letter-spacing:3px;text-shadow:0 2px #754b12}.credits{background:#00151ddd;border:1px solid #b88b34;border-radius:20px;padding:6px 12px;color:#fff}.board{position:relative;flex:1;min-height:0;border:3px solid #c89b3d;border-radius:14px;background:linear-gradient(#0b5660,#07303d);box-shadow:inset 0 0 28px #00151d,0 0 18px #000;padding:8px;overflow:hidden}.trail{position:absolute;top:5px;left:50%;transform:translateX(-50%);color:#ffe89b;font-weight:bold;background:#09222bdd;border:1px solid #d9ad4e;border-radius:16px;padding:3px 12px;z-index:3}.reels{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;height:100%;position:relative}.reel{background:linear-gradient(90deg,#09232c,#0b3b45,#09232c);border:1px solid #397079;border-radius:8px;position:relative;overflow:hidden}.reel::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent,rgba(255,255,255,.06),transparent);pointer-events:none}.cell{position:absolute;left:4%;width:92%;height:20%;display:grid;place-items:center;font-size:clamp(18px,6vw,32px);font-weight:900;transition:transform .22s,opacity .22s}.cell.card{color:#fff;text-shadow:0 2px 2px #000;border-radius:5px}.cell.card[data-v="A"]{background:#d84848}.cell.card[data-v="K"]{background:#444}.cell.card[data-v="Q"]{background:#9b4fc2}.cell.card[data-v="J"]{background:#3d79c5}.cell.card[data-v="10"]{background:#2f9274}.cell.wild{background:linear-gradient(135deg,#ffe873,#d58920);border-radius:50%;color:#161616;font-size:34px}.cell.gold{background:#d7a438;color:#fff;border-radius:50%;text-shadow:0 2px #765007}.winline{position:absolute;inset:0;border:2px solid #ffe05e;box-shadow:inset 0 0 15px #ffd84d;pointer-events:none;opacity:0}.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:center}.btn{border:2px solid #d7a641;border-radius:10px;background:linear-gradient(#f0cb61,#b97918);color:#241400;font-weight:900;padding:10px 6px;box-shadow:0 4px #71460e;cursor:pointer}.btn:active{transform:translateY(3px);box-shadow:0 1px #71460e}.btn.secondary{background:linear-gradient(#2c7180,#16414e);color:#fff;border-color:#5ca0aa;box-shadow:0 4px #0c2730}.buy{color:#ffe89b;background:linear-gradient(#8a3cbb,#45206a);border-color:#d9ad4e}.info{display:flex;justify-content:space-between;color:#b9d8da;font-size:12px;padding:0 2px}.message{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);background:#031016dd;border:2px solid #e8bc52;border-radius:12px;padding:14px 20px;text-align:center;font-weight:bold;color:#ffe89b;opacity:0;transition:opacity .2s;pointer-events:none;z-index:4}.flash{animation:flash .45s}@keyframes flash{50%{background:#fff3a5;color:#111}}@media(max-height:600px){.game{padding:6px}.cell{font-size:24px}.title{font-size:16px}.btn{padding:6px}}
</style>
</head>
<body>
<div class="shell"><main class="game">
<header class="top"><div class="title">MAGIC ACE</div><div class="credits">CREDIT <span id="credits">10000</span></div></header>
<section class="board"><div class="trail" id="trail">BOOMING x1</div><div class="reels" id="reels"></div><div class="winline" id="winline"></div><div class="message" id="message"></div></section>
<div class="info"><span>WAYS 243</span><span id="mode">BASE GAME</span><span>MAX 2100x</span></div>
<section class="controls"><button class="btn secondary" id="betDown">BET −</button><button class="btn" id="spin">SPIN</button><button class="btn secondary" id="betUp">BET +</button><button class="btn secondary" id="extra">EXTRA BET</button><button class="btn buy" id="buy">BUY FREE SPINS 50x</button><button class="btn secondary" id="help">PAYTABLE</button></section>
</main></div>
<script>
const $=s=>document.querySelector(s), reels=$('#reels'), creditsEl=$('#credits'), trail=$('#trail'), msg=$('#message');
const ranks=['A','K','Q','J','10','9','8','7','6','5','4','3','2'];
let credits=10000, bet=20, rows=3, cols=5, grid=[], spinning=false, cascade=0, freeSpins=0, freeBase=1, extra=false;
for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const el=document.createElement('div');el.className='cell';el.dataset.r=r;el.dataset.c=c;reels.append(el)}
function rand(a){return a[Math.floor(Math.random()*a.length)]}
function makeGrid(){grid=Array.from({length:rows},()=>Array.from({length:cols},()=>({v:rand(ranks),kind:'card'})));for(let c=1;c<4;c++)if(Math.random()<.07)grid[rand([0,1,2])][c]={v:'★',kind:'gold'};}
function paint(){[...reels.children].forEach((el,i)=>{const r=Math.floor(i/cols),c=i%cols,x=grid[r]?.[c];el.className='cell '+(x?.kind||'card');el.dataset.v=x?.v||'';el.textContent=x?.kind==='wild'?'JOKER':x?.v||'';el.style.transform=`translateY(${r*100}%)`})}
function update(){creditsEl.textContent=credits.toLocaleString();trail.textContent=`BOOMING x${cascade||1}`;$('#mode').textContent=freeSpins?`FREE SPINS ${freeSpins}`:'BASE GAME';$('#spin').textContent=freeSpins?'FREE SPIN':'SPIN'}
function wins(){const wins=[];for(let c=0;c<cols;c++){const vals=grid.map(r=>r[c].v);const same=vals.every(v=>v===vals[0])||vals.every(v=>['★','JOKER'].includes(v)||v===vals[0]);if(same&&vals[0]!=='JOKER')wins.push(c)}return wins}
function show(text,ms=1000){msg.textContent=text;msg.style.opacity=1;setTimeout(()=>msg.style.opacity=0,ms)}
function settle(){let total=0, rounds=0;while(rounds++<8){const ws=wins();if(!ws.length)break;cascade++;const mult=Math.min(5,cascade);const base=ws.length*bet*mult*2;total+=base;grid=grid.map(row=>row.map(x=>x.kind==='wild'?x:{...x,gone:true}));paint();show(`WIN ${base}  x${mult}`,700);for(let c of ws)for(let r=0;r<rows;r++)if(grid[r][c].kind==='card')grid[r][c]={v:rand(ranks),kind:'card'};paint();trail.textContent=`BOOMING x${mult}`}
if(total){credits+=total;show(`WIN ${total}`,1200)}else{cascade=0;trail.textContent='BOOMING x1'}update()}
async function spin(){if(spinning)return;spinning=true;$('#spin').disabled=true;let stake=bet*(extra?1.5:1);if(freeSpins){stake=0;freeSpins--}else{if(credits<stake){show('INSUFFICIENT CREDITS');spinning=false;$('#spin').disabled=false;return}credits-=stake}
cascade=freeSpins?1:0;makeGrid();paint();for(let i=0;i<9;i++){grid.forEach((row,r)=>row.forEach((x,c)=>{if(i>=4-r)x.v=rand(ranks)}));paint();await new Promise(r=>setTimeout(r,55))}await new Promise(r=>setTimeout(r,250));settle();if(freeSpins===0){freeBase=1}spinning=false;$('#spin').disabled=false;update()}
$('#spin').onclick=spin;$('#betDown').onclick=()=>{bet=Math.max(10,bet-10);update()};$('#betUp').onclick=()=>{bet=Math.min(200,bet+10);update()};$('#extra').onclick=()=>{extra=!extra;$('#extra').textContent=extra?'EXTRA BET ON':'EXTRA BET';show(extra?'EXTRA BET ENABLED':'EXTRA BET OFF')};$('#buy').onclick=()=>{const cost=bet*50;if(credits>=cost){credits-=cost;freeSpins=10;freeBase=2;show('FREE SPINS!',1200);update()}};$('#help').onclick=()=>show('A-K-Q-J WINS LEFT TO RIGHT • 243 WAYS • CASCADES x1–x5',2200);makeGrid();paint();update();
</script>
</body></html>
